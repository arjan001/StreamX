name: Deploy Documentation to GitHub Pages

on:
  workflow_dispatch:
    description: "Manually redeploy documentation site (without APKs from build)"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: app-*
          path: apk
          merge-multiple: false

      - name: Download version
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: version

      - name: Build documentation
        run: |
          mkdir -p site
          cp -r docs site/
          cp -r internal-docs site/
          cp -r legal site/
          cp README.md site/
          cp docs/index.html site/index.html
          # Copy all APKs to site with clear names (skip if no APKs available)
          if [ -d "apk" ]; then
            for apk in apk/*/*.apk; do
              [ -f "$apk" ] || continue
              filename=$(basename "$apk")
              cp "$apk" "site/$filename"
            done
          fi
          # Update version in index.html
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            VERSION=$(node -p "require('./version.json').version")
          fi
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
