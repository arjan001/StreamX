name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [test, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Build Android debug APK
        env:
          STREAMIX_API_ORIGIN: https://dev.lovix.com
          VITE_APP_BUILD: '1'
        run: |
          pnpm --filter @iptv/mobile build:web
          pnpm --filter @iptv/mobile sync
          cd apps/mobile/android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK build output
        run: |
          APK_DIR="apps/mobile/android/app/build/outputs/apk/debug"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            echo "Build may have failed. Checking Gradle output..."
            ls -la apps/mobile/android/app/build/outputs/ 2>/dev/null || echo "No outputs directory"
            exit 1
          fi
          echo "APK files found:"
          ls -la "$APK_DIR"/*.apk 2>/dev/null || { echo "::error::No APK files found in $APK_DIR"; exit 1; }

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate version
        id: tag
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt
          retention-days: 1

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skip if tag already exists — avoids "rejected (already exists)" on re-runs
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.tag.outputs.tag }}$"; then
            echo "Tag ${{ steps.tag.outputs.tag }} already exists on remote, skipping."
          else
            git tag -a ${{ steps.tag.outputs.tag }} -m "Release ${{ steps.tag.outputs.version }}"
            git push origin ${{ steps.tag.outputs.tag }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare releases directory
        run: mkdir -p releases

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: releases

      - name: Download version
        uses: actions/download-artifact@v4
        with:
          name: version

      - name: Verify APK artifacts
        run: |
          if [ -z "$(find releases -name '*.apk' -type f 2>/dev/null)" ]; then
            echo "::error::No APK artifacts found in releases directory. The build-apk job may have failed to upload artifacts."
            exit 1
          fi
          echo "Found APK artifacts:"
          find releases -name '*.apk' -type f

      - name: Generate checksums
        run: |
          cd releases
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Get version tag
        id: tag
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.version }}
          files: |
            releases/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk-debug
          path: apk
          merge-multiple: false

      - name: Download version
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: version

      - name: Build documentation site
        run: |
          mkdir -p site
          # Copy the main docs page
          cp docs/index.html site/index.html
          # Copy legal documents if they exist
          cp -r legal site/ 2>/dev/null || true
          # Copy and rename APKs to the expected download names
          if [ -d "apk" ]; then
            # Debug APKs are named app-debug-<abi>.apk, rename to streamix-<abi>.apk
            [ -f "apk/app-debug-arm64-v8a.apk" ] && cp "apk/app-debug-arm64-v8a.apk" "site/streamix-arm64.apk"
            [ -f "apk/app-debug-armeabi-v7a.apk" ] && cp "apk/app-debug-armeabi-v7a.apk" "site/streamix-armv7.apk"
            [ -f "apk/app-debug-x86_64.apk" ] && cp "apk/app-debug-x86_64.apk" "site/streamix-x86_64.apk"
            [ -f "apk/app-debug-universal.apk" ] && cp "apk/app-debug-universal.apk" "site/streamix-universal.apk"
            # If renamed APKs exist, also copy them (in case build was changed)
            for apk in apk/streamix-*.apk; do
              [ -f "$apk" ] || continue
              cp "$apk" "site/"
            done
          fi
          # Replace version placeholder
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            VERSION=$(node -p "require('./version.json').version")
          fi
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" site/index.html
          echo "Deploying version: $VERSION"
          echo "APKs in site:"
          ls -la site/*.apk 2>/dev/null || echo "WARNING: No APKs found in site!"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

