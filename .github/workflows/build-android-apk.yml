name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [test, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.streamix-signing
          keytool -genkeypair -v -keystore ~/.streamix-signing/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=StreamX, OU=Dev, O=StreamX, L=City, S=State, C=US"
          cat > ~/.streamix-signing/keystore.properties << 'EOF'
          storeFile=~/.streamix-signing/release.keystore
          storePassword=android
          keyAlias=release
          keyPassword=android
          EOF
          echo "STREAMIX_KEYSTORE_PROPS=$HOME/.streamix-signing/keystore.properties" >> $GITHUB_ENV

      - name: Build Android release APK
        env:
          STREAMIX_API_ORIGIN: https://dev.lovix.com
          VITE_APP_BUILD: '1'
        run: |
          pnpm --filter @iptv/mobile build:web
          pnpm --filter @iptv/mobile sync
          cd apps/mobile/android
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK build output
        run: |
          APK_DIR="apps/mobile/android/app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            echo "Build may have failed. Checking Gradle output..."
            ls -la apps/mobile/android/app/build/outputs/ 2>/dev/null || echo "No outputs directory"
            exit 1
          fi
          echo "APK files found:"
          ls -la "$APK_DIR"/*.apk 2>/dev/null || { echo "::error::No APK files found in $APK_DIR"; exit 1; }

      - name: Upload APK - ARM64
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK - ARMv7
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK - Universal
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-universal-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate version
        id: tag
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt
          retention-days: 1

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skip if tag already exists — avoids "rejected (already exists)" on re-runs
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.tag.outputs.tag }}$"; then
            echo "Tag ${{ steps.tag.outputs.tag }} already exists on remote, skipping."
          else
            git tag -a ${{ steps.tag.outputs.tag }} -m "Release ${{ steps.tag.outputs.version }}"
            git push origin ${{ steps.tag.outputs.tag }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download version
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: version

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-*-release
          path: site
          merge-multiple: false

      - name: Build documentation
        run: |
          mkdir -p site
          cp -r docs site/
          cp -r internal-docs site/
          cp -r legal site/
          cp README.md site/
          cp docs/index.html site/index.html
          # Move APK files to site root with clean names
          if [ -d site/app-arm64-v8a-release ]; then
            mv site/app-arm64-v8a-release/*.apk site/streamix-arm64.apk
          fi
          if [ -d site/app-armeabi-v7a-release ]; then
            mv site/app-armeabi-v7a-release/*.apk site/streamix-armv7.apk
          fi
          if [ -d site/app-universal-release ]; then
            mv site/app-universal-release/*.apk site/streamix-universal.apk
          fi
          # Update version in index.html
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            VERSION=$(node -p "require('./version.json').version")
          fi
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare releases directory
        run: mkdir -p releases

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: releases
          merge-multiple: false

      - name: Download version
        uses: actions/download-artifact@v4
        with:
          name: version

      - name: Verify APK artifacts
        run: |
          if [ -z "$(find releases -name '*.apk' -type f 2>/dev/null)" ]; then
            echo "::error::No APK artifacts found in releases directory. The build-apk job may have failed to upload artifacts."
            exit 1
          fi
          echo "Found APK artifacts:"
          find releases -name '*.apk' -type f

      - name: Generate checksums
        run: |
          cd releases
          > SHA256SUMS.txt
          for dir in app-*; do
            if [ -d "$dir" ]; then
              (cd "$dir" && sha256sum *.apk) >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Get version tag
        id: tag
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.version }}
          files: |
            releases/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Release ${{ steps.tag.outputs.version }}

            ### Downloads
            - **ARM64 APK**: For most modern devices (recommended)
            - **ARMv7 APK**: For older devices and legacy TV boxes
            - **Universal APK**: Works on all devices (larger file)

            ### Changes
            See commit history for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
