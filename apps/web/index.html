<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) report anything at
      all; without it a notched phone silently paints under the notch. Pinch-zoom
      is deliberately left alone (no user-scalable=no) — the tap delay is killed
      with touch-action in CSS instead, which does not cost accessibility.
      interactive-widget=resizes-content keeps the soft keyboard from covering
      inputs by shrinking the layout viewport rather than scrolling the page.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1013" />
    <!-- Standalone-app chrome when installed, and on iOS when wrapped. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      ── identity ──────────────────────────────────────────────────────────────
      Generated by `apps/web/scripts/brand.mjs` from the same mark as the Android
      launcher icon, so the tab, the home-screen icon and the shared link cannot
      drift apart. Run that script rather than editing the files by hand.

      The SVG comes first because every current browser prefers it and it is the
      only one that stays sharp at any tab size; the PNGs and the .ico are for the
      ones that will not take it — and `/favicon.ico` is what a bare request from
      a chat client or feed reader asks for before it reads any HTML.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" sizes="48x48" />
    <!-- iOS ignores the manifest icons and composites a transparent one on white,
         so this one carries its own dark ground. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>StreamX — A player for your own sources</title>
    <meta name="description" content="A player for the TV sources you add — playlists, Xtream servers and portals. Contains no channels." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamX" />
    <meta property="og:title" content="StreamX — A player for your own sources" />
    <meta property="og:description" content="A player for the TV sources you add — playlists, Xtream servers and portals. Contains no channels." />
    <meta property="og:image:alt" content="StreamX — A player for your own sources." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="StreamX — A player for your own sources" />
    <meta name="twitter:description" content="A player for the TV sources you add — playlists, Xtream servers and portals. Contains no channels." />

    <!--
      Three methods a 2020 television does not have.

      Samsung and LG sets cannot install the Android app at all, so their own
      browser is the only way in, and Samsung's own figures put Tizen 5.5 — the
      2020 sets — on Chromium 69, with LG webOS 5 around 68. `build.target` in
      vite.config.ts settles the SYNTAX those engines must read, and can do
      nothing whatever about a method that does not exist on them:

        Array.prototype.flat / flatMap   Chrome 69
        Object.fromEntries               Chrome 73
        globalThis                       Chrome 71

      Measured, not feared. `scripts/old-engine-probe.mjs` deletes those from a
      current browser before the page runs, and without this block EVERY screen
      renders blank on one error — `flatMap is not a function` — including the
      page itself.

      Inline and first, above the gap probe, because it has to be in place
      before any module chunk is evaluated; a module import would be too late
      for whatever a vendor chunk does at its own top level. Written in ES5 —
      `var`, `function`, no arrows — because nothing transpiles this file and
      the engines it is for are the point.

      Each shim is installed only where the real one is missing, so a modern
      television runs the engine's own implementation and never touches this.
      Semantics are checked against the real methods by
      `scripts/legacy-shim.test.mjs`, which runs THIS block rather than a copy
      of it, so the two cannot drift.
    -->
    <script>
      /* legacy-shim:start */
      (function () {
        if (typeof globalThis === 'undefined') {
          try { window.globalThis = window; } catch (e) { /* nothing else to try */ }
        }
        var A = Array.prototype;
        function def(o, name, fn) {
          if (o[name]) return;
          try { Object.defineProperty(o, name, { value: fn, writable: true, configurable: true }); }
          catch (e) { o[name] = fn; }
        }
        def(A, 'flat', function (depth) {
          var d = depth === undefined ? 1 : Math.floor(Number(depth)) || 0;
          var out = [];
          (function walk(arr, left) {
            for (var i = 0; i < arr.length; i++) {
              /* A hole is not a value: the real one skips it rather than
                 pushing undefined, and code that counts results can tell. */
              if (!(i in arr)) continue;
              var v = arr[i];
              if (left > 0 && Array.isArray(v)) walk(v, left - 1); else out.push(v);
            }
          })(this, d);
          return out;
        });
        def(A, 'flatMap', function (fn, thisArg) {
          var out = [];
          for (var i = 0; i < this.length; i++) {
            if (!(i in this)) continue;
            var v = fn.call(thisArg, this[i], i, this);
            if (Array.isArray(v)) out.push.apply(out, v); else out.push(v);
          }
          return out;
        });
        if (!Object.fromEntries) {
          Object.fromEntries = function (entries) {
            var out = {};
            var it = typeof Symbol !== 'undefined' && entries != null ? entries[Symbol.iterator] : null;
            /* A Map and an array of pairs are both iterables of pairs, and this
               app passes both. The indexed path is the fallback for neither. */
            if (typeof it === 'function') {
              var iter = it.call(entries), step;
              while (!(step = iter.next()).done) out[step.value[0]] = step.value[1];
              return out;
            }
            for (var i = 0; i < entries.length; i++) out[entries[i][0]] = entries[i][1];
            return out;
          };
        }
        /* Chromium 98. The one caller is a dependency that only asks "can this
           be cloned?" inside a try/catch, but a real clone is cheap to give it.
           Covers what structured clone covers for plain data and throws for
           what it refuses (functions, symbols), which is the part callers use. */
        var G = typeof window !== 'undefined' ? window : globalThis;
        if (typeof G.structuredClone !== 'function') {
          G.structuredClone = function (value) {
            var seen = new Map();
            function fail(what) {
              var err = new Error(what + ' could not be cloned.');
              err.name = 'DataCloneError';
              throw err;
            }
            function copy(v) {
              if (v === null || (typeof v !== 'object' && typeof v !== 'function')) {
                if (typeof v === 'symbol') fail('Symbol');
                return v;
              }
              if (typeof v === 'function') fail('Function');
              if (seen.has(v)) return seen.get(v);
              var out, tag = Object.prototype.toString.call(v);
              if (Array.isArray(v)) {
                out = new Array(v.length);
                seen.set(v, out);
                for (var i = 0; i < v.length; i++) if (i in v) out[i] = copy(v[i]);
                return out;
              }
              if (tag === '[object Date]') return new Date(v.getTime());
              if (tag === '[object RegExp]') return new RegExp(v.source, v.flags);
              if (tag === '[object ArrayBuffer]') return v.slice(0);
              if (ArrayBuffer.isView(v)) {
                return new v.constructor(v.buffer.slice(0), v.byteOffset, v.length === undefined ? v.byteLength : v.length);
              }
              if (tag === '[object Map]') {
                out = new Map(); seen.set(v, out);
                v.forEach(function (val, key) { out.set(copy(key), copy(val)); });
                return out;
              }
              if (tag === '[object Set]') {
                out = new Set(); seen.set(v, out);
                v.forEach(function (val) { out.add(copy(val)); });
                return out;
              }
              if (tag !== '[object Object]' && tag !== '[object Error]') fail(tag);
              out = {};
              seen.set(v, out);
              for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) out[k] = copy(v[k]);
              return out;
            }
            return copy(value);
          };
        }
      })();
      /* legacy-shim:end */
    </script>

    <!--
      Can this box space a flex row?

      Flexbox `gap` is Chrome/WebView 84. Below it the declaration is ignored in
      silence and every space in the app becomes zero — reproduced on a Google TV
      AVD running WebView 83, where the header reads `HomeMoviesSeriesLive TV` and
      the cards share an edge. `scripts/css-compat.mjs` emits a margin fallback
      for every gap utility, behind `html[data-nogap]`, and this is what decides
      whether that fallback applies. A television that supports gap never sees it.

      There is no feature query for this: `CSS.supports('gap','1px')` answers yes
      on a browser that only has GRID gap, which is every version from 66 to 83.
      So it is measured — two 10px children with a 10px gap shrink-wrap to 30px
      where it works and 20px where it does not.

      Inline and in the head, before the splash paints, because the alternative is
      a visible reflow on the slowest hardware the app runs on. Wrapped in
      try/catch: a box where this throws should get the app, not a blank page.
    -->
    <script>
      (function () {
        try {
          var p = document.createElement('div');
          p.style.cssText = 'position:absolute;visibility:hidden;display:flex;gap:10px';
          p.innerHTML = '<i style="width:10px"></i><i style="width:10px"></i>';
          var root = document.documentElement;
          root.appendChild(p);
          var wide = p.getBoundingClientRect().width;
          root.removeChild(p);
          if (wide < 25) root.setAttribute('data-nogap', 'on');
        } catch (e) { /* leave it on: a modern box is the safer guess */ }
      })();
    </script>

    <!--
      Does this box know `:focus-visible`?

      It is Chromium 86, and an engine that has never heard of it does not
      just ignore the pseudo-class — the CSS Selectors grammar makes the WHOLE
      rule it appears in invalid, comma-list and all, and the rule that draws
      this app's focus ring is one of the 60 dropped with it. A D-pad
      television interface with no focus ring anywhere cannot be told which
      tile the remote is about to activate, which is the interface.

      `CSS.supports('selector(:focus-visible)')` cannot be the test: the
      `selector()` feature-query function is itself Chromium 88, two versions
      later, so it answers "unsupported" on 86 and 87 too. What is reliable is
      that `document.querySelector` parses its argument with the Selectors
      API's NON-forgiving grammar — the same grammar that voids the stylesheet
      rule — so an engine with no production for this pseudo-class fails that
      parse and throws `SyntaxError`, exactly where the stylesheet rule would
      have been dropped. `scripts/css-compat.mjs` reads `data-nofocusvisible`
      and duplicates every `:focus-visible` rule with the pseudo-class swapped
      for plain `:focus` — which also flashes on a mouse click, since `:focus`
      cannot tell a click from a remote press apart, but a ring that is
      occasionally too eager beats no ring at all on hardware that mostly has
      no pointer to click with.
    -->
    <script>
      (function () {
        try {
          document.querySelector(':focus-visible');
        } catch (e) {
          document.documentElement.setAttribute('data-nofocusvisible', 'on');
        }
      })();
    </script>

    <!--
      `aspect-ratio` and `backdrop-filter`, checked the ordinary way.

      Neither needs a rendered measurement like the gap probe above: `gap`
      only had to be measured because `CSS.supports('gap','1px')` answers yes
      for grid-only support and lies about flex, and neither of these two
      properties has that split. `aspect-ratio` is Chromium 88 — below it a box
      that gets its height only from the ratio has none, and
      `scripts/css-compat.mjs` restores it with the classic padding-percentage
      hack for the one utility class it is safe to apply to (see the long
      comment there for which of the other three it deliberately leaves alone,
      and why). `backdrop-filter` is Chromium 76 and usually cosmetic; the one
      exception — a header that relies on the blur rather than its own
      background colour to stay readable over a moving picture — is handled
      the same way, gated on `data-nobackdrop`.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          if (!window.CSS || !CSS.supports('aspect-ratio', '1 / 1')) root.setAttribute('data-noaspect', 'on');
        } catch (e) { /* leave it on: a modern box is the safer guess */ }
        try {
          if (!window.CSS || !CSS.supports('backdrop-filter', 'blur(1px)')) root.setAttribute('data-nobackdrop', 'on');
        } catch (e) { /* leave it on: a modern box is the safer guess */ }
      })();
    </script>
  </head>
  <body>
    <!-- brand:splash:start -->
    <!--
      The splash, in the document rather than in the app.

      A React splash cannot be a splash: it appears after the bundle has parsed,
      which is the exact interval it exists to cover. This is plain markup with
      inline styles, so it is on screen with the first paint — before any script —
      and `main.tsx` takes it away once the app has actually rendered.

      Generated from brand.config.json by scripts/brand-apply.mjs. Do not hand-edit
      inside the fence.
    -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
        background:#0b1013;transition:opacity .32s ease-out}
      #splash.is-gone{opacity:0;pointer-events:none}
      #splash .art{display:flex;flex-direction:column;align-items:center;gap:1.1rem}
      #splash img{width:min(38vw,190px);height:auto;
        animation:splash-in .55s cubic-bezier(.2,.8,.2,1) both}
      /* A bar rather than a spinner: it says "loading" without pretending to know
         how much is left, and it reads across a room. */
      #splash .bar{width:min(30vw,150px);height:2px;overflow:hidden;
        background:rgba(255,255,255,.08);border-radius:2px}
      #splash .bar span{display:block;width:40%;height:100%;background:#f09018;
        animation:splash-sweep 1.15s ease-in-out infinite}
      @keyframes splash-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
      @keyframes splash-sweep{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
      @media (prefers-reduced-motion:reduce){
        #splash img,#splash .bar span{animation:none}
        #splash .bar span{width:100%}
      }
    </style>
    <div id="splash" role="status" aria-label="Loading StreamX">
      <div class="art">
        <img src="%BASE_URL%brand-logo.png?v=a5407aa234" alt="" />
        <div class="bar"><span></span></div>
      </div>
    </div>
    <!-- brand:splash:end -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
