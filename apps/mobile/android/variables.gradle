ext {
    /*
     * minSdkVersion 23 (Android 6.0) — required by Capacitor 7.
     *
     * Fire TV Stick OS 7 runs Android 7.1 (API 25), so this is compatible.
     * Older Android TV boxes running Android 5.0 (API 21) are not supported
     * by Capacitor 7 — they would need a custom native build without Capacitor.
     */
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    /*
     * libVLC, for the codecs a WebView will not play.
     *
     * Maven only publishes libvlc-all (monolithic .so per ABI). abiFilters +
     * ABI splits keep each APK to one arch; stripping libc++ and dropping
     * unused lua/HRTF assets is the rest of what packaging can do without a
     * custom vlc-android rebuild.
     */
    libvlcVersion = '3.6.5'
}